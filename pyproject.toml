# -*- coding: utf-8 -*-
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-companion"
version = "1.1.0"
description = "微信虚拟伴侣：屏幕捕捉 + 键鼠模拟 + DeepSeek 自动回复（Windows 本地运行）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wechat-companion contributors" }]
keywords = ["wechat", "automation", "deepseek", "pyautogui", "screen-capture", "rpa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Window Managers",
]
dependencies = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "mss>=9.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.31",
    "psutil>=5.9",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wechat-companion = "wechat_companion.companion:main"

# 标准 src 布局：应用包位于 src/
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
