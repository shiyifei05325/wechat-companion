name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        run: python scripts/build_exe.py --onefile

      - name: Verify artifact
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/WeChatCompanion.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} - 微信虚拟伴侣
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/WeChatCompanion.exe
