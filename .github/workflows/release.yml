name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python scripts/build_exe.py --onefile

      - name: Verify artifact
        shell: bash
        run: |
          ls -lh dist/
          test -f dist/WeChatCompanion.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} - 微信虚拟伴侣
          body: |
            微信虚拟伴侣 ${{ github.ref_name }} 版本。
            下载下方 WeChatCompanion.exe 后双击运行，仅支持 Windows。
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/WeChatCompanion.exe
