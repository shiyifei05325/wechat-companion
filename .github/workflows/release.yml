name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} - 微信虚拟伴侣（首个开源版本）
          body_path: docs/release-notes/v1.1.0.md
          draft: false
          prerelease: false
          make_latest: "true"
